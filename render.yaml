services:
  - type: web
    name: resumeiq-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: resumeiq
      - key: JWT_SECRET
        generateValue: true
      - key: API_BASE_URL
        value: https://resumeiq-y88i.onrender.com
      - key: CLIENT_APP_URL
        value: https://resume-iq-nine-ruby.vercel.app
